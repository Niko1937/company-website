<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- LinkedIn banners and the link preview (OGP) image in the website Hero style: banner.html#company | #plain | #ceo | #og
     (render commands: _sources/brand/README.md) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #1F1F1F; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .banner { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); }
  /* The Hero photo: dark on the left, the blue/violet network on the right */
  /* The photo's own left edge is navy, not #1F1F1F, so it fades in instead of ending in a seam */
  .photo { position: absolute; inset: 0; background: url(../../photos/hero/background.jpg) no-repeat; background-size: var(--photo-size); background-position: var(--photo-pos);
    -webkit-mask-image: linear-gradient(90deg, transparent var(--fade-a), #000 var(--fade-b)); mask-image: linear-gradient(90deg, transparent var(--fade-a), #000 var(--fade-b)); }
  /* Same overlay as the Hero: from-[#1F1F1F] 40% -> /80 60% -> transparent */
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) var(--shade-a), rgba(31,31,31,.8) var(--shade-b), rgba(31,31,31,0) var(--shade-c)); }
  .copy { position: absolute; }
  .grad { color: transparent; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; background-clip: text; }
  .grad .w { color: #fff; -webkit-text-fill-color: #fff; }
  h1 { font-weight: 700; line-height: 1.25; letter-spacing: -.01em; white-space: nowrap; }

  /* Company cover 1512x256: two lines as on the Hero, clear of the logo (bottom-left) */
  body.company .banner { --photo-size: auto 210%; --photo-pos: right 50%; --fade-a: 50%; --fade-b: 75%; --shade-a: 55%; --shade-b: 70%; --shade-c: 86%; }
  body.company .copy { left: 23.15vw; top: 50%; transform: translateY(-58%); }
  body.company h1 { font-size: 2.8vw; }

  body.plain .banner { --photo-size: auto 240%; --photo-pos: right 50%; --fade-a: 40%; --fade-b: 75%; --shade-a: 0%; --shade-b: 0%; --shade-c: 0%; }
  body.plain .copy { display: none; }

  /* CEO profile 1584x396: Quests / tagline (the URL goes in the profile's own link instead), inside the mobile-safe middle and clear of the photo */
  body.ceo .banner { --photo-size: auto 175%; --photo-pos: right 50%; --fade-a: 50%; --fade-b: 75%; --shade-a: 55%; --shade-b: 68%; --shade-c: 84%; }
  body.ceo .copy { left: 27.5vw; top: 50%; transform: translateY(-50%); }
  body.ceo .name { font-size: 5.6vw; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
  body.ceo h1 { font-size: 2.3vw; margin-top: 1.1vw; }

  /* Link preview (OGP) 1200x627: the same Quests / tagline as the CEO banner, at least 8% from every edge */
  body.og .banner { --photo-size: auto 125%; --photo-pos: right 50%; --fade-a: 30%; --fade-b: 62%; --shade-a: 48%; --shade-b: 70%; --shade-c: 90%; }
  body.og .copy { left: 9vw; top: 50%; transform: translateY(-50%); }
  body.og .name { font-size: 10.5vw; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
  body.og h1 { font-size: 3.9vw; margin-top: 1.8vw; }
  body:not(.ceo):not(.og) .name { display: none; }
</style>
</head>
<body>
<div class="banner">
  <div class="photo"></div>
  <div class="shade"></div>
  <div class="copy">
    <div class="name">Quests</div>
    <h1>
      <div class="l1">Pioneering the Future</div>
      <div class="l2"><span class="lead">with </span><span class="grad">Big Tech Expertise <span class="w">at</span> Startup Speed</span></div>
    </h1>
  </div>
</div>
<script>
  const type = location.hash.slice(1) || 'company';
  document.body.className = type;
  // The CEO banner and the OGP image keep only "Big Tech Expertise at Startup Speed" on one line
  if (type === 'ceo' || type === 'og') { document.querySelector('.l1').remove(); document.querySelector('.lead').remove(); }
</script>
</body>
</html>
