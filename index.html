<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quests - Pioneering the Future with Intelligent Technology</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="/en/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="ja" href="/ja/">
<link rel="alternate" hreflang="x-default" href="/en/">
<meta http-equiv="refresh" content="0; url=/en/">
<script>
(function() {
  try {
    var stored = localStorage.getItem('preferredLang');
    var supported = ['en', 'ja'];
    var target = 'en';
    if (stored && supported.indexOf(stored) !== -1) {
      target = stored;
    } else {
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (lang.indexOf('ja') === 0) target = 'ja';
    }
    location.replace('/' + target + '/' + location.hash);
  } catch (e) {
    location.replace('/en/' + location.hash);
  }
})();
</script>
</head>
<body>
<p>Redirecting to <a href="/en/">/en/</a>…</p>
</body>
</html>
