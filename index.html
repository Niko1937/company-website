<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quests - Pioneering the Future with Intelligent Technology</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="/images/corporate-logo.svg"/>
<link rel="canonical" href="/en/">
<link rel="alternate" hreflang="en" href="/en/">
<link rel="alternate" hreflang="ja" href="/ja/">
<link rel="alternate" hreflang="x-default" href="/en/">
<meta http-equiv="refresh" content="0; url=/en/">
<script>
(function() {
  try {
    var stored = localStorage.getItem('preferredLang');
    var supported = ['en', 'ja'];
    var target = 'en';
    if (stored && supported.indexOf(stored) !== -1) {
      target = stored;
    } else {
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (lang.indexOf('ja') === 0) target = 'ja';
    }
    location.replace('/' + target + '/');
  } catch (e) {
    location.replace('/en/');
  }
})();
</script>
</head>
<body>
<p>Redirecting to <a href="/en/">/en/</a>…</p>
</body>
</html>
